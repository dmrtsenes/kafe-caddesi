// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/*
 * JAVA 21 ARAÇ ZİNCİRİ
 *
 * Capacitor 8 modülleri `sourceCompatibility 21` ile geliyor. Gradle'ı çalıştıran
 * JDK 17 olduğunda javac "invalid source release: 21" ile patlıyor. Burada her
 * Java derleme görevine Gradle'ın sağladığı JDK 21 derleyicisi verilir; sistem
 * JAVA_HOME'a dokunulmaz, gerekirse Foojay çözücü JDK'yı indirir.
 */
subprojects {
    afterEvaluate { p ->
        p.tasks.withType(JavaCompile).configureEach {
            javaCompiler.set(
                p.extensions.getByType(JavaToolchainService).compilerFor {
                    languageVersion.set(JavaLanguageVersion.of(21))
                }
            )
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
