/*
 * Capacitor 8 Java 21 ile derlenir. Bu makinede sistem Java'sı 17 olduğu için
 * Gradle'ın kendi araç zincirini indirmesine izin veriyoruz (Foojay çözücü).
 * Sistem JDK'sına dokunulmaz; indirilen JDK Gradle'ın kendi önbelleğinde durur.
 * Sistemde zaten 21 varsa indirme yapılmaz, mevcut olan kullanılır.
 */
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'